<script>

["Coffee Espresso",[["Americano",50],["Cappuccino",60],["Spanish",60],["Macchiato",60],["Chocolate Mocha",60],["White Chocolate",60],["Cheesecake",60],["Strawberry",60]]],
["Milk Based",[["Milk and Caramel",60],["Milk and Chocolate",60],["Milk and White Chocolate",60],["Milk and Cheesecake",60],["Strawberry and Milk",60],["Choco Strawberry and Milk",60]]],
["Fruit Tea Soda",[["Green Apple",35],["Blueberry",35],["Mixed Berries",35],["Ice Tea with Calamansi",35]]],
["Matcha Based",[["Matcha Latte",70],["Matcha Espresso",80],["Matcha Strawberry",80]]]];

const PIN="1234",$=s=>document.querySelector(s),peso=n=>"₱"+(Math.round(n*100)/100),COST=.5,LOW=10,PAL=["#f5b800","#e5604d","#4cc38a","#6aa7ff","#c78bff","#ff9f5a"];
const ALL=MENU.flatMap(([c,a])=>a.map(([n,p])=>({n,p,c}))),catOf={};ALL.forEach(x=>catOf[x.n]=x.c);

const getInv=()=>demo?dInv:inv, getDone=()=>(demo?dOrders:orders).filter(o=>o.status==="done");
function art(n){const[c,t]=ART[n]||["#a67c52","iced"],id="g"+n.replace(/\W/g,"");
let s=`<svg viewBox="0 0 100 100"><defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${c}" stop-opacity=".8"/><stop offset="1" stop-color="${c}"/></linearGradient></defs><circle cx="50" cy="52" r="38" fill="${c}" opacity=".22"/>`;

else{s+=`<path d="M29 24h42l-5 58H34z" fill="#fff" fill-opacity=".14" stroke="#f4efe3" stroke-opacity=".6" stroke-width="2.5" stroke-linejoin="round"/><path d="M31.4 40h37.2l-3.7 42H35z" fill="url(#${id})"/><rect x="38" y="46" width="10" height="10" rx="2" fill="#fff" fill-opacity=".35" transform="rotate(12 43 51)"/><rect x="52" y="58" width="10" height="10" rx="2" fill="#fff" fill-opacity=".3" transform="rotate(-10 57 63)"/><path d="M58 8L52 56" stroke="#f5b800" stroke-width="3.5" stroke-linecap="round"/>`;
s+=t==="soda"?`<circle cx="42" cy="70" r="2.5" fill="#fff" opacity=".6"/><circle cx="60" cy="48" r="2" fill="#fff" opacity=".6"/><circle cx="48" cy="60" r="1.8" fill="#fff" opacity=".6"/><circle cx="72" cy="26" r="9" fill="#f5d94a"/><circle cx="72" cy="26" r="6" fill="none" stroke="#fff" stroke-opacity=".7" stroke-width="1.5"/>`:`<ellipse cx="50" cy="24" rx="21" ry="3.5" fill="#f4efe3" opacity=".5"/>`}
return s+"</svg>"}
function bars(a,h=150){const n=a.length||1,W=Math.max(320,n*40),mx=Math.max(1,...a.map(x=>x.v)),bw=W/n;
return `<svg viewBox="0 0 ${W} ${h+34}" style="width:100%;min-width:${Math.min(W,560)}px">`+a.map((x,i)=>{const bh=x.v/mx*h,X=i*bw+bw*.15,w=bw*.7;

if(n<=14&&x.v)r+=`<text x="${X+w/2}" y="${h+1-bh}" text-anchor="middle" font-size="10" fill="#f4efe3">${x.t||Math.round(x.v)}</text>`;

function donut(d){const T=d.reduce((s,x)=>s+x.v,0)||1,C=2*Math.PI*38;let off=0;

function setStock(n,v){v=Math.max(0,Math.floor(+v)||0);const r={n,stock:v};if(demo){dInv[n]=r;render()}else if(invColl)invColl.doc(n.toLowerCase().replace(/[^a-z0-9]+/g,"-")).set(r).catch(console.error);else{inv[n]=r;render()}}

function genDemo(){let s=7;const r=()=>(s=(s*16807)%2147483647)/2147483647,o=[];
for(let d=20;d>=0;d--){const day=new Date();day.setDate(day.getDate()-d);const wd=day.getDay(),cnt=Math.round((14+(wd%6==0?8:0)+(20-d)*.4)*(.8+r()*.4));

function forecast(L){const byD={},wd={};L.forEach(o=>{const k=dk(o.t);byD[k]=(byD[k]||0)+o.total});
const keys=Object.keys(byD),first=L.length?Math.min(...L.map(o=>o.t)):Date.now(),span=Math.max(1,Math.min(14,Math.ceil((Date.now()-first)/864e5)+1));
const data=[];for(let i=span-1;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);data.push(byD[dk(d)]||0)}
const n=data.length,mean=data.reduce((a,b)=>a+b,0)/n;let sl=0;if(n>=3){const mx=(n-1)/2;let num=0,den=0;data.forEach((y,i)=>{num+=(i-mx)*(y-mean);den+=(i-mx)**2});sl=num/den}
keys.forEach(k=>{const w=new Date(k+"T12:00").getDay();(wd[w]=wd[w]||[]).push(byD[k])});
const tot=keys.reduce((a,k)=>a+byD[k],0),avgAll=tot/Math.max(1,keys.length),fac=w=>wd[w]&&wd[w].length>=2?Math.min(1.5,Math.max(.6,(wd[w].reduce((a,b)=>a+b,0)/wd[w].length)/avgAll)):1;
const pred=[];for(let i=1;i<=7;i++){const d=new Date();d.setDate(d.getDate()+i);pred.push({d,v:Math.max(0,(mean+sl*(n-1+i-(n-1)/2))*fac(d.getDay()))})}
