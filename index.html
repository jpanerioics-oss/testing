<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>H-HOOD CAFE</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@400;600&display=swap" rel="stylesheet">
  <link rel="manifest" href="data:application/manifest+json;utf8,{&quot;name&quot;:&quot;H-HOOD CAFE&quot;,&quot;short_name&quot;:&quot;H-HOOD&quot;,&quot;start_url&quot;:&quot;.&quot;,&quot;display&quot;:&quot;standalone&quot;,&quot;background_color&quot;:&quot;%2317181b&quot;,&quot;theme_color&quot;:&quot;%23f5b800&quot;}">

  <!-- ================= STYLES ================= -->
  <style>
    /* ===== Theme & base ===== */
    :root {
      color-scheme:dark;
      --bg:#17181b;
      --card:#25272c;
      --line:#3a3d43;
      --y:#f5b800;
      --t:#f4efe3;
      --m:#9a9a9a;
      --g:#4cc38a;
      --r:#e5604d;
      box-sizing:border-box;
      padding-top:env(safe-area-inset-top,0px);
      padding-bottom:env(safe-area-inset-bottom,0px);
    }
    * {
      box-sizing:border-box;
    }
    html {
      scroll-padding-top:env(safe-area-inset-top,0px);
      scroll-behavior:smooth;
    }
    body {
      margin:0;
      background:radial-gradient(1200px 500px at 50% -100px,#2a2418,var(--bg));
      color:var(--t);
      font-family:Oswald,system-ui,sans-serif;
      font-size:16px;
    }
    h1,h2,h3 {
      font-family:'Bebas Neue',Impact,sans-serif;
      letter-spacing:.04em;
      margin:0;
      font-weight:400;
    }

    /* ===== Header & navigation ===== */
    header {
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:12px 18px;
      border-bottom:2px solid var(--y);
      position:sticky;
      top:env(safe-area-inset-top,0px);
      background:rgba(23,24,27,.94);
      backdrop-filter:blur(8px);
      z-index:5;
    }
    header h1 {
      font-size:30px;
      color:var(--y);
    }
    header small {
      color:var(--m);
      display:block;
      font-size:12px;
      letter-spacing:.1em;
    }
    nav a {
      color:var(--t);
      text-decoration:none;
      border:1px solid var(--line);
      padding:6px 12px;
      border-radius:20px;
      font-size:14px;
      margin-left:6px;
    }
    nav a.on {
      background:var(--y);
      color:#111;
      border-color:var(--y);
    }
    body::before {
      content:"";
      position:fixed;
      inset:0 0 auto;
      height:env(safe-area-inset-top,0px);
      background:rgba(23,24,27,.94);
      z-index:10;
    }
    main {
      max-width:1120px;
      margin:0 auto;
      padding:16px;
    }

    /* ===== Customer: hero, search chips, menu grid ===== */
    .hero {
      border-radius:18px;
      padding:26px 24px;
      margin-bottom:8px;
      background:linear-gradient(120deg,#f5b800,#e08a00);
      color:#1a1405;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      overflow:hidden;
    }
    .hero h2 {
      font-size:44px;
      line-height:1;
    }
    .hero p {
      margin:6px 0 0;
      font-weight:600;
    }
    .hero .hero-badge {
      width:96px;
      height:96px;
      flex-shrink:0;
      border-radius:16px;
      overflow:hidden;
      box-shadow:0 8px 24px rgba(0,0,0,.35);
      background:#17181b;
      display:grid;
      place-items:center;
      border:2px solid rgba(255,255,255,.2);
    }
    .hero .hero-badge img {
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
    }
    .chips {
      display:flex;
      gap:8px;
      overflow-x:auto;
      padding:10px 0;
      position:sticky;
      top:calc(58px + env(safe-area-inset-top,0px));
      background:var(--bg);
      z-index:4;
    }
    .chips button {
      white-space:nowrap;
      border:1px solid var(--line);
      background:var(--card);
      color:var(--t);
      border-radius:20px;
      padding:6px 14px;
      font:600 14px Oswald,sans-serif;
      cursor:pointer;
    }
    .layout {
      display:grid;
      grid-template-columns:1fr 340px;
      gap:18px;
    }
    @media(max-width:820px) {
      .layout {
        grid-template-columns:1fr;
      }
      .hero h2 {
        font-size:32px;
      }
      .hero .hero-badge {
        width:72px;
        height:72px;
        border-radius:12px;
      }
    }
    .cat {
      font-size:28px;
      margin:18px 0 10px;
      border-left:4px solid var(--y);
      padding-left:10px;
    }
    .grid {
      display:grid;
      grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
      gap:12px;
    }
    .item {
      position:relative;
      background:var(--card);
      border:1px solid var(--line);
      border-radius:14px;
      padding:0 0 10px;
      cursor:pointer;
      text-align:left;
      color:var(--t);
      font:inherit;
      display:flex;
      flex-direction:column;
      gap:4px;
      overflow:hidden;
      transition:.15s;
    }
    .item:hover {
      transform:translateY(-3px);
      border-color:var(--y);
    }
    .item:active {
      transform:scale(.97);
    }
    .item .art {
      background:#2f3136;
    }
    .item .art svg {
      display:block;
      width:100%;
      height:auto;
    }
    .item b {
      font-weight:600;
      font-size:14px;
      text-transform:uppercase;
      padding:0 10px;
      line-height:1.15;
      min-height:32px;
    }
    .pr {
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:0 10px;
    }
    .pr span {
      color:var(--y);
      font-size:19px;
    }
    .pr em {
      font-style:normal;
      font-size:12px;
      background:var(--y);
      color:#111;
      border-radius:12px;
      padding:2px 9px;
      font-weight:600;
    }
    .bd {
      position:absolute;
      top:8px;
      right:8px;
      background:var(--g);
      color:#06210f;
      border-radius:50%;
      width:24px;
      height:24px;
      display:grid;
      place-items:center;
      font-style:normal;
      font-weight:600;
      font-size:13px;
    }
    .item:disabled {
      opacity:.4;
      cursor:not-allowed;
    }
    .item small {
      color:var(--r);
      padding:0 10px;
      font-size:12px;
    }

    /* ===== Cart & order confirmation ===== */
    .cart {
      background:var(--card);
      border:1px solid var(--line);
      border-radius:14px;
      padding:14px;
      align-self:start;
      position:sticky;
      top:130px;
    }
    .row {
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:8px;
      padding:6px 0;
      border-bottom:1px dashed var(--line);
      font-size:14px;
    }
    .q {
      display:flex;
      align-items:center;
      gap:6px;
    }
    .q button {
      width:26px;
      height:26px;
      border-radius:50%;
      border:1px solid var(--line);
      background:none;
      color:var(--t);
      cursor:pointer;
    }
    input {
      width:100%;
      padding:10px;
      border-radius:8px;
      border:1px solid var(--line);
      background:var(--bg);
      color:var(--t);
      font:inherit;
      margin:8px 0;
    }
    .btn {
      width:100%;
      padding:12px;
      border:0;
      border-radius:10px;
      background:var(--y);
      color:#111;
      font:600 17px Oswald,sans-serif;
      cursor:pointer;
      letter-spacing:.05em;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:8px;
    }
    .btn:disabled {
      opacity:.4;
      cursor:default;
    }
    .btn.s {
      width:auto;
      padding:6px 12px;
      font-size:14px;
    }
    .spinner {
      width:16px;
      height:16px;
      border:2px solid rgba(0,0,0,.2);
      border-top-color:#111;
      border-radius:50%;
      animation:spin .6s linear infinite;
    }
    @keyframes spin {
      to { transform:rotate(360deg); }
    }
    .tot {
      display:flex;
      justify-content:space-between;
      font-size:22px;
      margin:10px 0;
      color:var(--y);
    }
    .fab {
      display:none;
    }
    @media(max-width:820px) {
      .fab {
        display:flex;
        position:fixed;
        left:12px;
        right:12px;
        bottom:calc(12px + env(safe-area-inset-bottom,0px));
        z-index:6;
        box-shadow:0 6px 20px #000a;
      }
      main {
        padding-bottom:90px;
      }
    }
    .ok {
      text-align:center;
      padding:30px 10px;
    }
    .ok .no {
      font:400 72px 'Bebas Neue',Impact,sans-serif;
      color:var(--y);
    }

    /* ===== Staff: order board, stats, tabs, tables, charts ===== */
    .cols {
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:14px;
    }
    @media(max-width:820px) {
      .cols {
        grid-template-columns:1fr;
      }
    }
    .col h3 {
      font-size:22px;
      padding:6px 0;
      border-bottom:3px solid var(--y);
      margin-bottom:10px;
    }
    .ord {
      background:var(--card);
      border:1px solid var(--line);
      border-radius:12px;
      padding:12px;
      margin-bottom:10px;
    }
    .ord h4 {
      margin:0 0 6px;
      font-size:18px;
      display:flex;
      justify-content:space-between;
    }
    .ord ul {
      margin:0 0 8px;
      padding-left:18px;
      font-size:14px;
    }
    .stats {
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      margin-bottom:12px;
    }
    .stat {
      background:var(--card);
      border:1px solid var(--line);
      border-radius:12px;
      padding:10px 16px;
      flex:1;
      min-width:120px;
    }
    .stat b {
      display:block;
      font:400 28px 'Bebas Neue',Impact,sans-serif;
      color:var(--y);
    }
    .m {
      color:var(--m);
      font-size:13px;
    }
    .note {
      background:#3a2f0a;
      border:1px solid var(--y);
      padding:8px 12px;
      border-radius:8px;
      font-size:13px;
      margin-bottom:12px;
    }
    .tabs {
      display:flex;
      gap:8px;
      margin-bottom:14px;
      flex-wrap:wrap;
    }
    .tabs button {
      padding:8px 16px;
      border-radius:20px;
      border:1px solid var(--line);
      background:var(--card);
      color:var(--t);
      font:600 15px Oswald,sans-serif;
      cursor:pointer;
    }
    .tabs button.on {
      background:var(--y);
      color:#111;
      border-color:var(--y);
    }
    table {
      width:100%;
      border-collapse:collapse;
      font-size:14px;
    }
    th,td {
      text-align:left;
      padding:8px;
      border-bottom:1px solid var(--line);
    }
    th {
      color:var(--m);
      font-weight:400;
      font-size:12px;
      letter-spacing:.08em;
    }
    td.n,th.n {
      text-align:right;
    }
    .box {
      background:var(--card);
      border:1px solid var(--line);
      border-radius:14px;
      padding:14px;
      margin-bottom:14px;
      overflow-x:auto;
    }
    .box h3 {
      font-size:22px;
      margin-bottom:8px;
    }
    .g2 {
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:14px;
    }
    @media(max-width:820px) {
      .g2 {
        grid-template-columns:1fr;
      }
    }
    .sm {
      width:70px;
      margin:0;
      padding:6px;
    }
    .low {
      color:var(--r);
    }
    .ok2 {
      color:var(--g);
    }
    .dn {
      display:flex;
      align-items:center;
      gap:16px;
      flex-wrap:wrap;
    }
    .lg {
      font-size:14px;
      margin:3px 0;
    }
    .lg i {
      display:inline-block;
      width:10px;
      height:10px;
      border-radius:3px;
      margin-right:6px;
    }
    .hb {
      display:grid;
      grid-template-columns:130px 1fr 80px;
      align-items:center;
      gap:8px;
      margin:5px 0;
      font-size:13px;
    }
    .hb div {
      background:#34373d;
      border-radius:5px;
      height:12px;
      overflow:hidden;
    }
    .hb i {
      display:block;
      height:100%;
      border-radius:5px;
    }
    .hb span:last-child {
      text-align:right;
      color:var(--m);
    }
    .ai {
      background:linear-gradient(135deg,#2b2a1c,#25272c);
      border:1px solid var(--y);
    }
    .ai li {
      margin:6px 0;
    }
    .leg {
      font-size:12px;
      color:var(--m);
    }
    .leg i {
      display:inline-block;
      width:10px;
      height:10px;
      border-radius:2px;
      margin:0 4px 0 10px;
    }

    /* ===== Customize sheet (modal) ===== */
    .ov {
      position:fixed;
      inset:0;
      background:#000b;
      backdrop-filter:blur(6px);
      z-index:20;
      display:flex;
      align-items:flex-end;
      justify-content:center;
      opacity:1;
      transition:opacity .2s ease-out;
    }
    .ov.closing {
      opacity:0;
    }
    .sheet {
      background:var(--card);
      width:100%;
      max-width:520px;
      max-height:92vh;
      overflow:auto;
      border-radius:20px 20px 0 0;
      padding:18px;
      position:relative;
      animation:up .2s ease-out;
      transition:transform .2s ease-out;
    }
    .ov.closing .sheet {
      transform:translateY(30px);
    }
    @media(min-width:700px) {
      .ov {
        align-items:center;
      }
      .sheet {
        border-radius:20px;
      }
    }
    @keyframes up {
      from {
        transform:translateY(30px);
        opacity:0;
      }
    }
    .sh {
      display:flex;
      gap:14px;
      align-items:center;
      margin-bottom:6px;
    }
    .art2 {
      width:92px;
      border-radius:14px;
      overflow:hidden;
      flex:none;
      background:#2f3136;
    }
    .art2 svg {
      display:block;
      width:100%;
    }
    .sheet h4 {
      margin:16px 0 8px;
      font:400 18px 'Bebas Neue',Impact,sans-serif;
      letter-spacing:.06em;
      color:var(--y);
    }
    .opts {
      display:flex;
      gap:8px;
      flex-wrap:wrap;
    }
    .op {
      padding:8px 14px;
      border-radius:20px;
      border:1px solid var(--line);
      background:var(--bg);
      color:var(--t);
      font:600 14px Oswald,sans-serif;
      cursor:pointer;
    }
    .op.on {
      background:var(--y);
      color:#111;
      border-color:var(--y);
    }
    .adds {
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:8px;
    }
    .ad {
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:6px;
      padding:10px;
      border-radius:10px;
      border:1px solid var(--line);
      background:var(--bg);
      color:var(--t);
      font:14px Oswald,sans-serif;
      cursor:pointer;
      text-align:left;
    }
    .ad.on {
      border-color:var(--g);
      background:#17302a;
    }
    .ad b {
      color:var(--y);
      font-weight:600;
      white-space:nowrap;
    }
    .x {
      position:absolute;
      top:10px;
      right:12px;
      background:none;
      border:0;
      color:var(--m);
      font-size:22px;
      cursor:pointer;
    }
    .bar {
      display:flex;
      gap:12px;
      align-items:center;
      margin-top:16px;
      position:sticky;
      bottom:-18px;
      background:var(--card);
      padding:10px 0;
    }
    .q.big {
      font-size:20px;
    }
    .q.big button {
      width:36px;
      height:36px;
      font-size:20px;
    }
    .srch {
      flex:1;
      min-width:150px;
      margin:0;
      padding:7px 12px;
      border-radius:20px;
    }

    /* ===== Misc & responsive tweaks ===== */
    .seg {
      display:flex;
      gap:6px;
      margin:8px 0;
    }
    .seg button {
      flex:1;
      padding:8px;
      border-radius:10px;
      border:1px solid var(--line);
      background:var(--bg);
      color:var(--t);
      font:600 14px Oswald,sans-serif;
      cursor:pointer;
    }
    .seg button.on {
      background:var(--y);
      color:#111;
      border-color:var(--y);
    }
    .cart .row>div:first-child {
      flex:1;
    }
    .cart .row b {
      font-weight:600;
    }
    @media(max-width:480px) {
      .adds {
        grid-template-columns:1fr;
      }
    }
    /* ===== Cart sections, payment picker, GCash box ===== */
    .cart h2 { font-size: 26px; margin-bottom: 6px; }
    .cart .sec { border-top: 1px solid var(--line); margin-top: 12px; padding-top: 10px; }
    .cart .sec h4 { margin: 0 0 6px; font: 400 17px 'Bebas Neue', Impact, sans-serif; letter-spacing: .06em; color: var(--y); }
    .cart input { margin: 6px 0; }
    @media (min-width: 821px) { .cart { max-height: calc(100vh - 150px); overflow: auto; } }
    .pms { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .pm { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; padding: 10px; border-radius: 12px; border: 2px solid var(--line); background: var(--bg); color: var(--t); font: 600 15px Oswald, sans-serif; cursor: pointer; text-align: left; }
    .pm small { font-weight: 400; font-size: 12px; color: var(--m); }
    .pm.on { border-color: var(--y); background: #2e2812; }
    .pm.gc.on { border-color: #2f7bff; background: #10213f; }
    .gc-box { margin-top: 10px; border: 1px solid #2f7bff; background: #0f1c33; border-radius: 12px; padding: 12px; text-align: center; }
    .qr { width: 100%; max-width: 210px; aspect-ratio: 1; object-fit: contain; background: #fff; border-radius: 12px; padding: 8px; display: block; margin: 0 auto 8px; }
    .qrph { width: 100%; max-width: 210px; aspect-ratio: 1; margin: 0 auto 8px; border: 2px dashed var(--line); border-radius: 12px; display: grid; place-items: center; color: var(--m); font-size: 13px; padding: 14px; }
    .amt { font: 400 34px 'Bebas Neue', Impact, sans-serif; color: var(--y); line-height: 1.1; }
    .gno { display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 18px; letter-spacing: .04em; margin-top: 4px; }
    .gno button { border: 1px solid var(--line); background: none; color: var(--t); border-radius: 8px; padding: 3px 10px; font: 14px Oswald, sans-serif; cursor: pointer; }
    .place { position: sticky; bottom: -14px; margin-top: 12px; background: var(--card); padding: 10px 0 2px; }
    @media (max-width: 820px) { .cart { position: static; } .place { position: static; } }
    .pill { display: inline-block; font-size: 12px; font-weight: 600; padding: 2px 10px; border-radius: 12px; margin: 2px 0; }
    .pill.cash, .pill.ok { background: #17302a; color: #4cc38a; }
    .pill.wait { background: #3a2f0a; color: var(--y); }

    /* ===== Self-service kiosk welcome screen ===== */
    .welcome {
      max-width: 1240px;
      min-height: min(760px, calc(100vh - 110px));
      margin: 18px auto;
      padding: 28px;
      display: grid;
      grid-template-columns: minmax(0, 1.05fr) minmax(320px, .95fr);
      gap: 28px;
      align-items: center;
      overflow: hidden;
      position: relative;
      isolation: isolate;
      border: 1px solid rgba(245,184,0,.25);
      border-radius: 26px;
      background:
        radial-gradient(ellipse at 12% 10%, rgba(245,184,0,.15), transparent 38%),
        linear-gradient(135deg, #242321 0%, #151619 58%, #211b12 100%);
      box-shadow: 0 24px 80px rgba(0,0,0,.38);
    }
    .welcome-copy { padding: 26px 12px 26px 22px; }
    .welcome-kicker {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      color: var(--y);
      font-size: 12px;
      letter-spacing: .22em;
      font-weight: 600;
      text-transform: uppercase;
      margin-bottom: 18px;
    }
    .welcome-kicker::before { content:""; width:28px; height:2px; background:var(--y); }
    .welcome-title {
      max-width: 650px;
      font-size: clamp(54px, 7.2vw, 100px);
      line-height: .88;
      letter-spacing: .015em;
      color: var(--t);
      text-transform: uppercase;
    }
    .welcome-title span { color: var(--y); display: block; }
    .welcome-description {
      max-width: 460px;
      color: #c4c0b6;
      font: 400 16px/1.7 Oswald, sans-serif;
      margin: 24px 0 30px;
    }
    .start-order {
      min-height: 66px;
      min-width: min(100%, 290px);
      padding: 16px 28px;
      border: 0;
      border-radius: 14px;
      background: var(--y);
      color: #171717;

    <div class="stats" style="margin-top:10px"><div class="stat"><span class="m">EXPECTED REVENUE</span><b>${peso(Math.round(f.next7))}</b></div><div class="stat"><span class="m">EXPECTED PROFIT</span><b>${peso(Math.round(f.next7 * (rev ? 1 - costSum(list) / rev : 0.5)))}</b></div><div class="stat"><span class="m">VS LAST 7 DAYS</span><b style="color:${ch >= 0 ? "var(--g)" : "var(--r)"}">${ch >= 0 ? "\u25B2" : "\u25BC"} ${Math.abs(Math.round(ch * 100))}%</b></div></div>
    ${L0.length ? `<ul><li>Busiest day ahead: <b>${ds(best.d)}</b> (about ${peso(Math.round(best.v))}).</li>${ph ? `<li>Peak hour is around <b>${fmtH(+ph[0])}</b>: have extra staff and cups ready.</li>` : ""}${topP.length ? `<li>Expect the most orders of: <b>${topP.map((x) => x[0]).join(", ")}</b>.</li>` : ""}<li>Forecast confidence: <b>${conf}</b>. It uses the recent trend plus which weekdays are usually busier.</li></ul>` : '<p class="m">Complete some orders (mark them PAID &amp; DONE) to unlock predictions, or tap "Preview with sample data".</p>'}</div>
    <div class="box"><h3>Restock advice (next 7 days)</h3><table><tr><th>ITEM</th><th class="n">AVG / DAY</th><th class="n">NEEDED (7D)</th><th class="n">IN STOCK</th><th class="n">SUGGESTED ORDER</th></tr>${adv.map((x) => `<tr><td>${x.n}</td><td class="n">${x.avg.toFixed(1)}</td><td class="n">${Math.ceil(x.d7)}</td><td class="n">${x.r ? x.r.stock : '<span class="m">not tracked</span>'}</td><td class="n ${x.need ? "low" : "ok2"}">${x.r ? x.need ? "+" + x.need + " cups" : "OK" : "\u2013"}</td></tr>`).join("") || '<tr><td class="m">No data yet</td></tr>'}</table><p class="m">Suggested order covers predicted demand plus a 20% safety buffer.</p></div>
    <p class="m">Only orders marked PAID &amp; DONE count as sales. Cost comes from each drink's recipe and your ingredient prices (Ingredients tab).</p>`;
    }

    // ============================================================
    // 10. CSV EXPORT
    // ============================================================

    async function exportCsv() {
      try {
        const dl = await claude.use("downloads");
        if (!dl) {
          alert("Download isn't available here.");
          return;
        }
        const { list } = salesData(), q = (s) => {
          s = String(s);
          if (/^[=+\-@\t\r]/.test(s)) s = "'" + s;
          return '"' + s.replace(/"/g, '""') + '"';
        };
        const csv = "Date,Order No,Customer,Items,Revenue,Cost,Profit,Payment\n" + list.map((o) => [q(new Date(o.t).toLocaleString()), o.no, q(o.name || ""), q(o.items.map((i) => i.q + "x " + i.n + (i.add && i.add.length ? " (+" + i.add.join(", ") + ")" : "")).join("; ")), o.total, orderCost(o), o.total - orderCost(o), o.pay || "Cash"].join(",")).join("\n");
        await dl.save({ filename: "hhood-sales-" + range + ".csv", data: csv });
      } catch (e) {
        console.error(e);
      }
    }

    // ============================================================
    // 11. STARTUP & LIVE SYNC
    // ============================================================

    document.addEventListener("change", (e) => {
      if (e.target.id !== "gqr" || !e.target.files[0]) return;
      const fr = new FileReader();
      fr.onload = () => {
        const im = new Image();
        im.onload = () => {
          const sc = Math.min(1, 520 / Math.max(im.width, im.height)), c = document.createElement("canvas");
          c.width = Math.round(im.width * sc); c.height = Math.round(im.height * sc);
          const x = c.getContext("2d"); x.fillStyle = "#fff"; x.fillRect(0, 0, c.width, c.height); x.drawImage(im, 0, 0, c.width, c.height);
          saveGcash({ qr: c.toDataURL("image/jpeg", 0.92) });
        };
        im.src = fr.result;
      };
      fr.readAsDataURL(e.target.files[0]);
    });
    window.addEventListener("hashchange", () => {
      if (!location.hash) landingStarted = false;
      else if (location.hash === "#order") landingStarted = true;
      render();
    });
    setInterval(() => { if (authed && view() === "admin" && tab === "kds" && !typing()) render(); }, 3e4);
    render();
    (async () => {
      try {
        const db = await claude.use("db");
        if (!db) return;
        coll = db.collection("orders");
        coll.orderBy("t", "desc").limit(500).onSnapshot((s) => {
          orders = s.docs.map((d) => d.data());
          if (view() === "admin") render();
        }, (e) => {
          console.error(e);
          coll = null;
          render();
        });
        invColl = db.collection("inventory");
        invColl.onSnapshot((s) => {
          inv = {};
          s.docs.forEach((d) => {
            const x = d.data();
            if (x && x.n) inv[x.n] = x;
          });
          if (!(view() === "order" && document.activeElement && document.activeElement.tagName === "INPUT")) render();
        }, (e) => console.error(e));
        ingColl = db.collection("ingredients");
        ingColl.onSnapshot((s) => { ing = {}; s.docs.forEach((d) => { const x = d.data(); if (x && x.k) ing[x.k] = x; }); if (!typing()) render(); }, (e) => console.error(e));
        wasteColl = db.collection("waste");
        wasteColl.orderBy("t", "desc").limit(100).onSnapshot((s) => { waste = s.docs.map((d) => d.data()); if (view() === "admin" && tab === "ingredients" && !typing()) render(); }, (e) => console.error(e));
        setColl = db.collection("settings");
        setColl.onSnapshot((s) => { s.docs.forEach((d) => { const x = d.data(); if (x && x.k === "gcash") GCASH = { no: x.no || GCASH.no, name: x.name || GCASH.name, qr: okQr(x.qr) }; }); if (!typing()) render(); }, (e) => console.error(e));
        loyColl = db.collection("loyalty");
        loyColl.onSnapshot((s) => { loy = {}; s.docs.forEach((d) => { const x = d.data(); if (x && x.k) loy[x.k] = x; }); if (view() === "admin" && !typing()) render(); }, (e) => console.error(e));
        render();
      } catch (e) {
        console.error(e);
      }
    })();
  </script>
</body>
